
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bienvenidos</title>

    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">

    <meta name="google-site-verification"
          content="pQMq-683FjbEJwTVSkE0yGTZrfJ89ELk6pMtQ3Ei-Q4">

    <style>
        body.portada-elegante {
            margin: 0;
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
            background:
                radial-gradient(ellipse at top, #243e60 0%, transparent 65%),
                linear-gradient(145deg, #071426, #10243e 55%, #071321);
            color: #f5f1e8;
            font-family: "Segoe UI", Tahoma, Verdana, sans-serif;
        }

        .portada-elegante .portada {
            width: 100%;
            max-width: 650px;
            box-sizing: border-box;
            padding: 56px 28px;
            text-align: center;
            border: 1px solid rgba(220, 190, 120, 0.48);
            border-radius: 22px;
            background: rgba(8, 22, 40, 0.72);
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.3);
        }

        .portada-elegante .detalle-superior {
            margin: 0 0 22px;
            color: #d7b96e;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .portada-elegante h1 {
            margin: 0;
            color: #f7f3e9;
            font-size: clamp(38px, 8vw, 60px);
            font-weight: 400;
            letter-spacing: 1px;
            line-height: 1.15;
        }

        .portada-elegante .linea-dorada {
            width: 76px;
            height: 2px;
            margin: 26px auto;
            background: #d7b96e;
        }

        .portada-elegante .descripcion {
            max-width: 420px;
            margin: 0 auto 34px;
            color: #c6d2e0;
            font-size: 16px;
            line-height: 1.8;
        }

        .portada-elegante .boton {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 54px;
            padding: 0 28px;
            box-sizing: border-box;
            border: 1px solid #e8d49a;
            border-radius: 9px;
            background: linear-gradient(135deg, #e6cd88, #c5a45d);
            color: #102039;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        .portada-elegante .boton:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
        }

        .portada-elegante .boton:focus-visible {
            outline: 3px solid #ffffff;
            outline-offset: 4px;
        }

        .portada-elegante .boton:disabled {
            cursor: wait;
            opacity: 0.8;
        }

        .portada-elegante .pie {
            margin: 36px 0 0;
            color: #a9b8ca;
            font-size: 11px;
            letter-spacing: 3px;
        }

        @media (max-width: 480px) {
            .portada-elegante .portada {
                padding: 44px 20px;
            }

            .portada-elegante .detalle-superior {
                font-size: 10px;
                letter-spacing: 3px;
            }

            .portada-elegante .descripcion {
                font-size: 14px;
            }

            .portada-elegante .boton {
                width: 100%;
                padding: 0 16px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .portada-elegante .boton {
                transition: none;
            }
        }
    </style>
</head>

<body class="portada-elegante">

    <main class="portada">

        <p class="detalle-superior">Un espacio para escuchar</p>

        <h1>Bienvenidos</h1>

        <div class="linea-dorada"></div>

        <p class="descripcion">
            Un lugar para disfrutar y compartir grabaciones.
        </p>

        <a href="audios.html" class="boton" id="boton-audios">
            <span aria-hidden="true">♫</span>
            <span>Escuchar Grabaciones</span>
        </a>

        <p class="pie">GRACIAS POR VISITARNOS</p>

    </main>

    <script>
        const botonAudios = document.getElementById("boton-audios");

        botonAudios.addEventListener("click", async function (evento) {
            evento.preventDefault();

            // Evita pulsaciones repetidas durante la melodía.
            if (botonAudios.dataset.reproduciendo === "si") {
                return;
            }

            botonAudios.dataset.reproduciendo = "si";
            botonAudios.setAttribute("aria-busy", "true");

            let contexto;

            try {
                const AudioContextClass =
                    window.AudioContext || window.webkitAudioContext;

                // Si el navegador no admite audio generado por código,
                // se continúa directamente a la página de grabaciones.
                if (!AudioContextClass) {
                    window.location.href = "audios.html";
                    return;
                }

                contexto = new AudioContextClass();
                await contexto.resume();

                // Notas DO, RE y MI de la cuarta octava.
                const notas = [
                    { frecuencia: 261.63, nombre: "DO" },
                    { frecuencia: 293.66, nombre: "RE" },
                    { frecuencia: 329.63, nombre: "MI" }
                ];

                // Sonido de órgano mediante varios armónicos.
                function tocarNota(frecuencia, duracion) {
                    return new Promise(resolve => {
                        const inicio = contexto.currentTime;
                        const volumen = contexto.createGain();

                        volumen.gain.setValueAtTime(0.0001, inicio);
                        volumen.gain.linearRampToValueAtTime(
                            0.12, inicio + 0.035
                        );
                        volumen.gain.setValueAtTime(
                            0.12, inicio + duracion - 0.06
                        );
                        volumen.gain.linearRampToValueAtTime(
                            0.0001, inicio + duracion
                        );

                        volumen.connect(contexto.destination);

                        const fundamental = contexto.createOscillator();
                        const armonico = contexto.createOscillator();

                        const mezclaArmonico = contexto.createGain();
                        mezclaArmonico.gain.value = 0.28;

                        fundamental.type = "sine";
                        fundamental.frequency.value = frecuencia;

                        armonico.type = "sine";
                        armonico.frequency.value = frecuencia * 2;

                        fundamental.connect(volumen);
                        armonico.connect(mezclaArmonico);
                        mezclaArmonico.connect(volumen);

                        fundamental.start(inicio);
                        armonico.start(inicio);

                        fundamental.stop(inicio + duracion);
                        armonico.stop(inicio + duracion);

                        fundamental.addEventListener("ended", () => {
                            resolve();
                        }, { once: true });
                    });
                }

                // Toca DO–RE–MI y espera que termine cada nota.
                for (const nota of notas) {
                    await tocarNota(nota.frecuencia, 0.38);
                    await new Promise(resolve => setTimeout(resolve, 60));
                }

                await contexto.close();
                contexto = null;

                // Navega una vez terminada la secuencia.
                window.location.href = "audios.html";

            } catch (error) {
                // Si ocurre un error de audio, no se bloquea la visita.
                if (contexto && contexto.state !== "closed") {
                    try {
                        await contexto.close();
                    } catch (errorCierre) {
                        // La navegación continúa aunque falle el cierre.
                    }
                }

                window.location.href = "audios.html";
            }
        });
    </script>

</body>
</html>
