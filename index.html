<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bienvenidos</title>

    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">

    <meta name="google-site-verification" content="pQMq-683FjbEJwTVSkE0yGTZrfJ89ELk6pMtQ3Ei-Q4">

</head>

<body class="portada-elegante">

    <main class="portada">

        <h1>Bienvenidos</h1>

        <div class="linea"></div>

        <a href="audios.html" class="boton" id="boton-audios">
    Escuchar Grabaciones
</a>
    </main>

    
<script>
    const botonAudios = document.getElementById("boton-audios");

    botonAudios.addEventListener("click", async function (evento) {
        evento.preventDefault();

        if (botonAudios.dataset.reproduciendo === "si") {
            return;
        }

        botonAudios.dataset.reproduciendo = "si";
        botonAudios.setAttribute("aria-busy", "true");

        let contexto;

        try {
            const AudioContextClass =
                window.AudioContext || window.webkitAudioContext;

            if (!AudioContextClass) {
                window.location.href = "audios.html";
                return;
            }

            contexto = new AudioContextClass();
            await contexto.resume();

            // Frecuencias de DO, RE y MI.
            const notas = [
                261.63,
                293.66,
                329.63
            ];

            // Simula una cuerda pulsada de guitarra criolla.
            function tocarNota(frecuencia, duracion) {
                return new Promise(resolve => {
                    const inicio = contexto.currentTime;
                    const salida = contexto.createGain();

                    salida.gain.setValueAtTime(0.0001, inicio);
                    salida.gain.linearRampToValueAtTime(
                        0.32, inicio + 0.008
                    );
                    salida.gain.exponentialRampToValueAtTime(
                        0.0001, inicio + duracion
                    );

                    salida.connect(contexto.destination);

                    // Armónicos que dan un timbre de cuerda.
                    const armonicos = [
                        { multiplo: 1, volumen: 1.0 },
                        { multiplo: 2, volumen: 0.45 },
                        { multiplo: 3, volumen: 0.22 },
                        { multiplo: 4, volumen: 0.10 },
                        { multiplo: 5, volumen: 0.04 }
                    ];

                    armonicos.forEach(dato => {
                        const oscilador = contexto.createOscillator();
                        const nivel = contexto.createGain();

                        oscilador.type = "triangle";
                        oscilador.frequency.setValueAtTime(
                            frecuencia * dato.multiplo,
                            inicio
                        );

                        nivel.gain.value = dato.volumen;

                        oscilador.connect(nivel);
                        nivel.connect(salida);

                        oscilador.start(inicio);
                        oscilador.stop(inicio + duracion);

                        if (dato.multiplo === 1) {
                            oscilador.addEventListener(
                                "ended",
                                resolve,
                                { once: true }
                            );
                        }
                    });
                });
            }

            // Melodía DO–RE–MI.
            for (const frecuencia of notas) {
                await tocarNota(frecuencia, 0.48);
                await new Promise(resolve =>
                    setTimeout(resolve, 70)
                );
            }

            await contexto.close();
            contexto = null;

            window.location.href = "audios.html";

        } catch (error) {
            if (contexto && contexto.state !== "closed") {
                try {
                    await contexto.close();
                } catch (errorCierre) {
                    // Se continúa con la navegación.
                }
            }

            window.location.href = "audios.html";
        }
    });
</script>

    
</body>
</html>
