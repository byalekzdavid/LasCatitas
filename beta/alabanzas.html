<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>Alabanzas | Las Catitas</title>
    <link rel="stylesheet" href="alabanzas.css">
</head>

<body class="pagina-alabanzas">

    <main class="biblioteca">
        <div class="marco-biblioteca">

            <header class="encabezado-biblioteca">
                <div class="marca-biblioteca">♫</div>
                <p class="nombre-biblioteca">Alabanzas</p>
                <p class="subtitulo-biblioteca">"Todo lo que respira alabe a Jehová. Aleluya." Sal. 150:6</p>
                <p class="descripcion-biblioteca">
                    Buscá y consultá las alabanzas disponibles.
                </p>
            </header>

            <section id="vista-listado" class="vista-listado">

                <div class="buscador-biblioteca">
                    <label for="buscar-pdf">BUSCAR ALABANZA</label>
                    <input
                        type="search"
                        id="buscar-pdf"
                        placeholder="Escribí el nombre de una alabanza..."
                        autocomplete="off">
                </div>

                <div id="lista-pdf" class="lista-pdf">
                    <p class="mensaje-vacio">
                        Próximamente estarán disponibles las alabanzas.
                    </p>
                </div>

            </section>

            <section id="vista-visor" class="vista-visor" hidden>

                <div class="barra-visor">
                    <button type="button" id="volver-listado">
                        ← Volver
                    </button>

                    <div class="controles-zoom">
                        <button type="button" id="alejar-pdf">−</button>
                        <span id="nivel-zoom">100%</span>
                        <button type="button" id="acercar-pdf">+</button>
                    </div>
                </div>

                <h2 id="titulo-pdf"></h2>

                <div id="contenedor-pdf" class="contenedor-pdf">
                    <!-- Aquí se mostrarán las páginas del PDF -->
                </div>

            </section>

            <a href="index.html" class="volver-inicio">
                ← Volver al inicio
            </a>

        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
</script>
    <script>
    const PDF_URL = "https://byalekzdavid.github.io/LasCatitas/beta/Cuadernillo cursiva con Klofkyna.pdf";

    const vistaListado = document.getElementById("vista-listado");
    const vistaVisor = document.getElementById("vista-visor");
    const listaPDF = document.getElementById("lista-pdf");
    const buscador = document.getElementById("buscar-pdf");
    const contenedorPDF = document.getElementById("contenedor-pdf");
    const tituloPDF = document.getElementById("titulo-pdf");
    const nivelZoom = document.getElementById("nivel-zoom");

    let documentoPDF = null;
    let zoom = 1;
    let observador = null;
        let dedos = new Map();
let distanciaInicial = 0;
let zoomInicial = 1;

contenedorPDF.style.touchAction = "pan-x pan-y";
contenedorPDF.style.overflowX = "auto";
contenedorPDF.style.overflowY = "auto";

function distanciaDedos() {
    const puntos = Array.from(dedos.values());
    const dx = puntos[0].x - puntos[1].x;
    const dy = puntos[0].y - puntos[1].y;

    return Math.hypot(dx, dy);
}

contenedorPDF.addEventListener("pointerdown", (e) => {
    dedos.set(e.pointerId, { x: e.clientX, y: e.clientY });
    contenedorPDF.setPointerCapture(e.pointerId);

    if (dedos.size === 2) {
        distanciaInicial = distanciaDedos();
        zoomInicial = zoom;
    }
});

contenedorPDF.addEventListener("pointermove", (e) => {
    if (!dedos.has(e.pointerId)) return;

    dedos.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (dedos.size === 2 && distanciaInicial > 0) {
        e.preventDefault();

        const factor = distanciaDedos() / distanciaInicial;
        const zoomTemporal = Math.min(2, Math.max(0.6, zoomInicial * factor));

        contenedorPDF.querySelectorAll(".pagina-pdf canvas").forEach(canvas => {
            canvas.style.transform = `scale(${zoomTemporal / zoom})`;
            canvas.style.transformOrigin = "top center";
        });
    }
});

function finalizarZoom(e) {
    dedos.delete(e.pointerId);

    if (distanciaInicial > 0) {
        const canvas = contenedorPDF.querySelector(".pagina-pdf canvas");

        if (canvas) {
            const factor = parseFloat(canvas.style.transform.match(/scale\(([^)]+)\)/)?.[1] || "1");
            zoom = Math.min(2, Math.max(0.6, zoom * factor));
        }

        distanciaInicial = 0;

        contenedorPDF.querySelectorAll(".pagina-pdf canvas").forEach(canvas => {
            canvas.style.transform = "";
        });

        actualizarZoom();
        mostrarPaginas();
    }
}

contenedorPDF.addEventListener("pointerup", finalizarZoom);
contenedorPDF.addEventListener("pointercancel", finalizarZoom);

    // Mostrar el documento de prueba en el listado.
    function mostrarListado() {
        listaPDF.innerHTML = `
            <button type="button" class="elemento-pdf" id="abrir-pdf">
                <span>📄</span>
                <span>Cuadernillo cursiva con Klofkyna</span>
            </button>
        `;

        document.getElementById("abrir-pdf").addEventListener("click", abrirPDF);
    }

    async function abrirPDF() {
        vistaListado.hidden = true;
        vistaVisor.hidden = false;
        tituloPDF.textContent = "Cuadernillo cursiva con Klofkyna";
        contenedorPDF.innerHTML = "<p>Cargando documento...</p>";

        try {
            const carga = pdfjsLib.getDocument(PDF_URL);
            documentoPDF = await carga.promise;

            zoom = 1;
            actualizarZoom();
            mostrarPaginas();
        } catch (error) {
            contenedorPDF.innerHTML =
                "<p>No se pudo cargar el PDF. Verificá que esté publicado correctamente.</p>";
            console.error("Error al cargar el PDF:", error);
        }
    }

    function mostrarPaginas() {
        if (observador) observador.disconnect();

        contenedorPDF.innerHTML = "";

        observador = new IntersectionObserver((entradas) => {
            entradas.forEach((entrada) => {
                if (entrada.isIntersecting) {
                    const pagina = Number(entrada.target.dataset.pagina);
                    renderizarPagina(pagina, entrada.target);
                    observador.unobserve(entrada.target);
                }
            });
        }, {
            root: contenedorPDF,
            rootMargin: "500px"
        });

        for (let numero = 1; numero <= documentoPDF.numPages; numero++) {
            const espacio = document.createElement("div");
            espacio.className = "pagina-pdf";
            espacio.dataset.pagina = numero;
            espacio.textContent = "Cargando página " + numero + "...";
            contenedorPDF.appendChild(espacio);
            observador.observe(espacio);
        }
    }

    async function renderizarPagina(numero, espacio) {
    try {
        const pagina = await documentoPDF.getPage(numero);
        const anchoDisponible = contenedorPDF.clientWidth - 24;
        const escalaBase = anchoDisponible / pagina.getViewport({ scale: 1 }).width;
        const escala = escalaBase * zoom;
        const viewport = pagina.getViewport({ scale: escala });

        // Aprovechar la resolución de la pantalla del celular.
        const pixelRatio = Math.min(window.devicePixelRatio || 1, 2.5);

        const canvas = document.createElement("canvas");
        const contexto = canvas.getContext("2d");

        canvas.width = Math.floor(viewport.width * pixelRatio);
        canvas.height = Math.floor(viewport.height * pixelRatio);

        canvas.style.width = viewport.width + "px";
        canvas.style.height = viewport.height + "px";
        canvas.style.display = "block";

        espacio.style.width = viewport.width + "px";
        espacio.style.margin = "0 auto";

        espacio.innerHTML = "";
        espacio.appendChild(canvas);

        await pagina.render({
            canvasContext: contexto,
            viewport: viewport,
            transform: [pixelRatio, 0, 0, pixelRatio, 0, 0]
        }).promise;

    } catch (error) {
        espacio.textContent = "No se pudo mostrar esta página.";
        console.error(error);
    }
}

    function actualizarZoom() {
        nivelZoom.textContent = Math.round(zoom * 100) + "%";
    }

    document.getElementById("acercar-pdf").addEventListener("click", () => {
        if (zoom < 2) {
            zoom += 0.2;
            actualizarZoom();
            mostrarPaginas();
        }
    });

    document.getElementById("alejar-pdf").addEventListener("click", () => {
        if (zoom > 0.6) {
            zoom -= 0.2;
            actualizarZoom();
            mostrarPaginas();
        }
    });

    document.getElementById("volver-listado").addEventListener("click", () => {
        if (observador) observador.disconnect();
        vistaVisor.hidden = true;
        vistaListado.hidden = false;
        contenedorPDF.innerHTML = "";
    });

    buscador.addEventListener("input", () => {
        const boton = document.getElementById("abrir-pdf");
        if (boton) {
            boton.style.display =
                "cuadernillo cursiva con klofkyna".includes(
                    buscador.value.toLowerCase()
                ) ? "" : "none";
        }
    });

    mostrarListado();
</script>
    
</body>
</html>
