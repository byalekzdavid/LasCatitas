<div id="modal-instalar-pwa" class="modal-pwa" hidden>

    <!-- Melodía DO - RE - MI antes de abrir las grabaciones -->
    <script>
        const botonAudios = document.getElementById("boton-audios");

        botonAudios.addEventListener("click", async function (evento) {
            evento.preventDefault();

            if (botonAudios.dataset.reproduciendo === "si") return;

            botonAudios.dataset.reproduciendo = "si";
            botonAudios.setAttribute("aria-busy", "true");

            let contexto;

            try {
                const AudioContextClass =
                    window.AudioContext || window.webkitAudioContext;

                if (!AudioContextClass) {
                    window.location.href = "audios.html";
                    return;
                }

                contexto = new AudioContextClass();
                await contexto.resume();

                function tocarNota(frecuencia, duracion) {
                    return new Promise(resolve => {
                        const inicio = contexto.currentTime;
                        const volumen = contexto.createGain();

                        volumen.gain.setValueAtTime(0.0001, inicio);
                        volumen.gain.linearRampToValueAtTime(
                            0.12, inicio + 0.035
                        );
                        volumen.gain.setValueAtTime(
                            0.12, inicio + duracion - 0.06
                        );
                        volumen.gain.linearRampToValueAtTime(
                            0.0001, inicio + duracion
                        );

                        volumen.connect(contexto.destination);

                        const fundamental = contexto.createOscillator();
                        const armonico = contexto.createOscillator();
                        const mezclaArmonico = contexto.createGain();

                        mezclaArmonico.gain.value = 0.28;
                        fundamental.type = "sine";
                        fundamental.frequency.value = frecuencia;
                        armonico.type = "sine";
                        armonico.frequency.value = frecuencia * 2;

                        fundamental.connect(volumen);
                        armonico.connect(mezclaArmonico);
                        mezclaArmonico.connect(volumen);

                        fundamental.start(inicio);
                        armonico.start(inicio);
                        fundamental.stop(inicio + duracion);
                        armonico.stop(inicio + duracion);

                        fundamental.addEventListener(
                            "ended", resolve, { once: true }
                        );
                    });
                }

                for (const frecuencia of [261.63, 293.66, 329.63]) {
                    await tocarNota(frecuencia, 0.38);
                    await new Promise(resolve => setTimeout(resolve, 60));
                }

                await contexto.close();
                contexto = null;
                window.location.href = "audios.html";

            } catch (error) {
                if (contexto && contexto.state !== "closed") {
                    try {
                        await contexto.close();
                    } catch (errorCierre) {}
                }

                window.location.href = "audios.html";
            }
        });
    </script>

    <!-- Registrar el service worker unificado -->
    <script>
        if ("serviceWorker" in navigator) {
  window.addEventListener("load", async () => {
    try {
      const registro = await navigator.serviceWorker.register(
        "./service-worker.js"
      );

      // Comprobar si existe una nueva versión.
      await registro.update();

    } catch (error) {
      console.error(
        "Error al registrar o actualizar el service worker:",
        error
      );
    }
  });
}
    </script>

    <!-- Botón de instalación PWA -->
    <script>
    let instalacionPendiente = null;

    const modalPWA = document.getElementById("modal-instalar-pwa");
    const botonInstalar = document.getElementById("confirmar-instalar-pwa");
    const botonAhoraNo = document.getElementById("ahora-no-pwa");
    const ayudaPWA = document.getElementById("ayuda-instalacion-pwa");
    const instruccionesPWA = document.getElementById("instrucciones-pwa");
    const accionesPWA = document.getElementById("acciones-modal-pwa");
    const cerrarAyuda = document.getElementById("cerrar-ayuda-pwa");

    function estaInstalada() {
        return window.matchMedia("(display-mode: standalone)").matches ||
               window.navigator.standalone === true;
    }

    function mostrarModal() {
        if (!estaInstalada()) {
            modalPWA.hidden = false;
        }
    }

    function cerrarModal() {
        modalPWA.hidden = true;
    }

    window.addEventListener("beforeinstallprompt", evento => {
        evento.preventDefault();
        instalacionPendiente = evento;
    });

    botonInstalar.addEventListener("click", async () => {
        if (instalacionPendiente) {
            const evento = instalacionPendiente;
            instalacionPendiente = null;

            const resultado = await evento.prompt();

            if (resultado.outcome === "accepted") {
                cerrarModal();
            } else {
                cerrarModal();
            }

            return;
        }

        // Instrucciones para navegadores sin instalación automática.
        const esIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);

        if (esIOS) {
            instruccionesPWA.textContent =
                "En Safari, tocá el botón Compartir y luego seleccioná " +
                "Agregar a pantalla de inicio.";
        } else {
            instruccionesPWA.textContent =
                "Abrí el menú de tu navegador (⋮ o ⋯) y buscá " +
                "'Instalar aplicación' o 'Agregar a pantalla de inicio'.";
        }

        accionesPWA.hidden = true;
        ayudaPWA.hidden = false;
    });

    botonAhoraNo.addEventListener("click", cerrarModal);
    cerrarAyuda.addEventListener("click", cerrarModal);

    window.addEventListener("appinstalled", () => {
        instalacionPendiente = null;
        cerrarModal();
    });

    window.addEventListener("load", () => {
        if (!estaInstalada()) {
            setTimeout(mostrarModal, 700);
        }
    });

    window.addEventListener("pageshow", () => {
        if (estaInstalada()) {
            cerrarModal();
        }
    });
</script>
