<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Las Catitas</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body class="portada-elegante">

    <main class="portada" style="max-width: 500px; margin: 40px auto; padding: 20px;">
        <h1>Panel Admin</h1>
        <div class="linea"></div>

        <div style="background: rgba(16, 36, 62, 0.8); padding: 20px; border-radius: 8px; border: 1px solid #d6b56d; text-align: left;">
            <h3 style="margin-top: 0; color: #d6b56d;">Enviar Notificación Push</h3>
            
            <form id="form-notificacion">
                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; font-size: 14px;">Título del aviso:</label>
                    <input type="text" id="notif-titulo" placeholder="Ej: ¡Nuevo audio disponible!" required style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc; background: #fff; color: #000; box-sizing: border-box;">
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; font-size: 14px;">Mensaje:</label>
                    <textarea id="notif-mensaje" rows="3" placeholder="Ej: Ya se encuentra subido el nuevo audio de Conj. Varones..." required style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc; background: #fff; color: #000; box-sizing: border-box;"></textarea>
                </div>

                <button type="submit" id="btn-enviar-notif" class="boton" style="width: 100%; cursor: pointer;">
                    🚀 Enviar a todos los suscriptores
                </button>
            </form>
        </div>

        <div style="margin-top: 20px;">
            <a href="index.html" class="boton" style="font-size: 12px; padding: 8px 15px;">← Volver al Inicio</a>
        </div>
    </main>

    <!-- SDKs de Firebase (Versión Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        // 1. Inicializar Firebase (Tus mismas credenciales)
        firebase.initializeApp({
            apiKey: "AIzaSyCX3vKQbWOEO4IP0ppPlHsIuiHN4sy0qTc",
            authDomain: "las-catitas.firebaseapp.com",
            projectId: "las-catitas",
            storageBucket: "las-catitas.firebasestorage.app",
            messagingSenderId: "69962715074",
            appId: "1:69962715074:web:b88edad813c0674e29505b"
        });

        const db = firebase.firestore();
        const formNotif = document.getElementById("form-notificacion");
        const btnEnviar = document.getElementById("btn-enviar-notif");

        // 2. Manejar el envío del formulario
        formNotif.addEventListener("submit", async (e) => {
            e.preventDefault();

            const titulo = document.getElementById("notif-titulo").value.trim();
            const mensaje = document.getElementById("notif-mensaje").value.trim();

            if (!titulo || !mensaje) return;

            btnEnviar.disabled = true;
            btnEnviar.textContent = "Enviando...";

            try {
                // Guardamos la petición en Firestore
                await db.collection("cola_notificaciones").add({
                    title: titulo,
                    body: mensaje,
                    fecha: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert("¡Notificación encolada con éxito! Se enviará a los suscriptores.");
                formNotif.reset();
            } catch (error) {
                console.error("Error al encolar notificación:", error);
                alert("Hubo un error al enviar la notificación.");
            } finally {
                btnEnviar.disabled = false;
                btnEnviar.textContent = "🚀 Enviar a todos los suscriptores";
            }
        });
    </script>
</body>
</html>
