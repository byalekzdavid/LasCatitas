<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#03132e">
  <meta name="description" content="Las Catitas: grabaciones y alabanzas.">

  <title>Audios | Conjuntos</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
 <header class="encabezado">
  <a href="index.html" class="marca" aria-label="Las Catitas - Inicio">
    <img
      class="logo"
      src="img/logo-las-catitas.png"
      alt="Logo de Las Catitas">

    <span class="marca-separador"></span>

    <span class="marca-texto">
      <strong>LAS CATITAS</strong>
      <small>GRABACIONES</small>
    </span>
  </a>
</header>
  
  <main>
    
    <section class="hero">
      <div class="hero-fondo"></div>

      <img
        class="hero-microfono"
        src="img/hero-microfono.png"
        alt=""
        aria-hidden="true">

      <div class="hero-contenido">
  <span class="hero-etiqueta">UN ESPACIO PARA ALABAR</span>

  <h1>Bienvenidos</h1>

  <span class="hero-linea"></span>

  <p>Grabaciones y alabanzas para compartir la Palabra de Dios.</p>
</div>

      <div class="hero-curva hero-curva-azul"></div>
      <div class="hero-curva hero-curva-dorada"></div>
    </section>

    
<section class="cita-biblica">
  <div class="cita-icono" aria-hidden="true">✦</div>

  <h2>"Todo lo que respira alabe a Jehová. Aleluya." Sal. 150:6</h2>

  <span class="cita-linea"></span>
</section>


    <section class="instalacion" id="bloque-instalacion">
      <div class="instalacion-icono" aria-hidden="true">
        <svg viewBox="0 0 70 85">
          <rect x="10" y="3" width="50" height="78" rx="9"
            fill="none" stroke="currentColor" stroke-width="5"/>
          <path d="M35 20 V49 M24 39 L35 50 L46 39"
            fill="none" stroke="currentColor" stroke-width="5"
            stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M25 67 H45" stroke="currentColor"
            stroke-width="4" stroke-linecap="round"/>
        </svg>
      </div>

      <span class="instalacion-separador"></span>

      <div class="instalacion-texto">
        <h2>Instalá nuestra aplicación</h2>
        <p>Accedé más rápido desde tu teléfono.</p>
      </div>

      <button id="instalar-app" class="boton-instalar" hidden>
        <span aria-hidden="true">↓</span>
        Instalar
      </button>
    </section>

  </main>

  <nav class="navegacion" aria-label="Navegación principal">
    <a href="index.html" class="nav-item activo" aria-current="page">
      <span class="nav-icono" aria-hidden="true">⌂</span>
      <span>Inicio</span>
    </a>

    <a href="audios.html" class="nav-item">
      <span class="nav-icono" aria-hidden="true">♫</span>
      <span>Audios</span>
    </a>

    <a href="alabanzas.html" class="nav-item">
      <span class="nav-icono" aria-hidden="true">▤</span>
      <span>Alabanzas</span>
    </a>
  </nav>

  <script>
    let instalacionPendiente = null;

    const botonInstalar = document.getElementById("instalar-app");

    window.addEventListener("beforeinstallprompt", (evento) => {
      evento.preventDefault();
      instalacionPendiente = evento;
      botonInstalar.hidden = false;
    });

    botonInstalar.addEventListener("click", async () => {
      if (!instalacionPendiente) return;

      instalacionPendiente.prompt();
      await instalacionPendiente.userChoice;

      instalacionPendiente = null;
      botonInstalar.hidden = true;
    });

    window.addEventListener("appinstalled", () => {
      instalacionPendiente = null;
      botonInstalar.hidden = true;
    });
  </script>

</body>
</html>
