<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#03132e">
  <meta name="description" content="Las Catitas: grabaciones y alabanzas.">

  <title>Audios | Conjuntos</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="encabezado">
    <a href="index.html" class="marca" aria-label="Las Catitas - Inicio">
      <img
  class="logo"
  src="img/logo-las-catitas.png"
  alt="Logo de Las Catitas">

      <span class="marca-separador"></span>

      <span class="marca-texto">
        <strong>Audios</strong>
        <small>Conjuntos</small>
      </span>
    </a>
  </header>

  <main>

    <section class="hero">
      <div class="hero-fondo"></div>

      <img
        class="hero-microfono"
        src="img/hero-microfono.png"
        alt=""
        aria-hidden="true"
      >

      <div class="hero-contenido">
        <span class="hero-etiqueta"></span>

        <h1>Bienvenidos</h1>

        <span class="hero-linea"></span>

        <p></p>
      </div>

      <div class="hero-curva hero-curva-azul"></div>
      <div class="hero-curva hero-curva-dorada"></div>
    </section>

    <section class="accesos" aria-label="Secciones principales">

      <a href="audios.html" class="tarjeta tarjeta-audios">
        <div class="tarjeta-ondas" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span>
        </div>

        <div class="tarjeta-ilustracion auriculares" aria-hidden="true">
          <svg viewBox="0 0 180 150">
            <path d="M35 83 V69 C35 30 59 10 90 10 C121 10 145 30 145 69 V83"
              fill="none" stroke="currentColor" stroke-width="13"
              stroke-linecap="round"/>
            <rect x="24" y="72" width="32" height="58" rx="13" fill="currentColor"/>
            <rect x="124" y="72" width="32" height="58" rx="13" fill="currentColor"/>
            <path d="M56 117 V132 Q56 141 68 141 H76"
              fill="none" stroke="currentColor" stroke-width="8"
              stroke-linecap="round"/>
          </svg>
        </div>

        <h2>Grabaciones</h2>
        <p>Escuchá los audios<br>disponibles.</p>

        <span class="tarjeta-flecha" aria-hidden="true">›</span>
      </a>

      <a href="alabanzas.html" class="tarjeta tarjeta-alabanzas">
        <div class="tarjeta-ondas" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span>
        </div>

        <div class="tarjeta-ilustracion libro" aria-hidden="true">
          <svg viewBox="0 0 180 150">
            <path d="M90 38 C67 16 43 18 18 26 V112 C46 103 68 107 90 128 C112 107 134 103 162 112 V26 C137 18 113 16 90 38Z"
              fill="currentColor" stroke="currentColor"
              stroke-width="5" stroke-linejoin="round"/>
            <path d="M90 38 V128" fill="none" stroke="#33265e"
              stroke-width="7" stroke-linecap="round"/>
            <path d="M31 40 C51 34 68 39 79 49 M149 40 C129 34 112 39 101 49"
              fill="none" stroke="#fff0bb" stroke-width="3"
              stroke-linecap="round" opacity=".7"/>
          </svg>
        </div>

        <h2>Alabanzas</h2>
        <p>Consultá letras<br>y documentos.</p>

        <span class="tarjeta-flecha" aria-hidden="true">›</span>
      </a>

    </section>

    <section class="instalacion" id="bloque-instalacion">
      <div class="instalacion-icono" aria-hidden="true">
        <svg viewBox="0 0 70 85">
          <rect x="10" y="3" width="50" height="78" rx="9"
            fill="none" stroke="currentColor" stroke-width="5"/>
          <path d="M35 20 V49 M24 39 L35 50 L46 39"
            fill="none" stroke="currentColor" stroke-width="5"
            stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M25 67 H45" stroke="currentColor"
            stroke-width="4" stroke-linecap="round"/>
        </svg>
      </div>

      <span class="instalacion-separador"></span>

      <div class="instalacion-texto">
        <h2>Instalá nuestra aplicación</h2>
        <p>Accedé más rápido desde tu teléfono.</p>
      </div>

      <button id="instalar-app" class="boton-instalar" hidden>
        <span aria-hidden="true">↓</span>
        Instalar
      </button>
    </section>

  </main>

  <nav class="navegacion" aria-label="Navegación principal">
    <a href="index.html" class="nav-item activo" aria-current="page">
      <span class="nav-icono" aria-hidden="true">⌂</span>
      <span>Inicio</span>
    </a>

    <a href="audios.html" class="nav-item">
      <span class="nav-icono" aria-hidden="true">♫</span>
      <span>Audios</span>
    </a>

    <a href="alabanzas.html" class="nav-item">
      <span class="nav-icono" aria-hidden="true">▤</span>
      <span>Alabanzas</span>
    </a>
  </nav>

  <script>
    let instalacionPendiente = null;

    const botonInstalar = document.getElementById("instalar-app");

    window.addEventListener("beforeinstallprompt", (evento) => {
      evento.preventDefault();
      instalacionPendiente = evento;
      botonInstalar.hidden = false;
    });

    botonInstalar.addEventListener("click", async () => {
      if (!instalacionPendiente) return;

      instalacionPendiente.prompt();
      await instalacionPendiente.userChoice;

      instalacionPendiente = null;
      botonInstalar.hidden = true;
    });

    window.addEventListener("appinstalled", () => {
      instalacionPendiente = null;
      botonInstalar.hidden = true;
    });
  </script>

</body>
</html>
